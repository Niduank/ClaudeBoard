<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#111110">
<title>Claude Dashboard</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" id="favicon" href="/icon.svg">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<style>
:root {
  --bg: #f4f3ef; --surface: #ffffff; --surface-2: #f8f7f4; --text: #1a1915; --muted: #6f6c64; --faint: #a19d93;
  --line: #e6e3db; --line-strong: #d6d2c7; --shadow: 0 1px 2px rgba(26,25,21,.05), 0 4px 16px rgba(26,25,21,.04);
  --run: #15803d; --run-soft: #e3f4e8; --wait: #c2410c; --wait-soft: #fdeee4; --idle: #8a867c; --idle-soft: #efede7;
  --ask: #7c3aed; --ask-soft: #efe7fd; --test: #0e7490; --test-soft: #e0f4f8; --new: #2563eb; --code: #f1efe9; --focus: #2563eb; --bar: #e6e3db;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #111110; --surface: #1b1a18; --surface-2: #211f1d; --text: #ecebe6; --muted: #a29e94; --faint: #6f6b63;
    --line: #2b2926; --line-strong: #3a3733; --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    --run: #4ade80; --run-soft: #16301f; --wait: #fb923c; --wait-soft: #35210f; --idle: #8a867c; --idle-soft: #262421;
    --ask: #a78bfa; --ask-soft: #271d3d; --test: #22d3ee; --test-soft: #0f2a30; --new: #60a5fa; --code: #262421; --focus: #60a5fa; --bar: #2f2d2a; }
}
* { box-sizing: border-box; }
/* author display rules (.drawer flex, .chip inline-flex) would otherwise beat the hidden attribute */
[hidden] { display: none !important; }
html { -webkit-font-smoothing: antialiased; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "SF Pro Text", "Inter", system-ui, sans-serif; }
.wrap { max-width: 1480px; margin: 0 auto; padding: 32px 32px 64px; }
.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 16px; margin-bottom: 20px; }
h1 { font-size: 26px; letter-spacing: -.02em; margin: 0; font-weight: 650; }
.sub { color: var(--muted); margin-top: 4px; }
.sub kbd { font: 11px ui-monospace, "SF Mono", Menlo, monospace; border: 1px solid var(--line-strong); border-bottom-width: 2px;
  border-radius: 4px; padding: 0 4px; color: var(--text); }
.bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 24px; }
.search { flex: 1 1 260px; min-width: 0; font: inherit; color: var(--text); background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; padding: 8px 12px; outline: none; }
.search:focus { border-color: var(--focus); }
.chip { display: inline-flex; gap: 7px; align-items: center; cursor: pointer; user-select: none; padding: 7px 12px; font: inherit;
  font-size: 13px; color: var(--muted); border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.chip:has(input:checked) { color: var(--text); border-color: var(--line-strong); }
.chip input { margin: 0; }
button.chip:hover { color: var(--text); }
.lang { display: inline-flex; padding: 3px; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); }
.lang button { font: inherit; font-size: 12px; font-weight: 600; letter-spacing: .04em; color: var(--muted); background: none; border: 0;
  border-radius: 999px; padding: 4px 11px; cursor: pointer; }
.lang button:hover { color: var(--text); }
.lang button[aria-pressed="true"] { color: var(--bg); background: var(--text); }
.kpis { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; margin-bottom: 36px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px 18px; box-shadow: var(--shadow); }
.kpi b { display: block; font-size: 30px; line-height: 1.1; font-weight: 650; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.kpi span { color: var(--muted); font-size: 13px; }
.kpi.run b { color: var(--run); } .kpi.wait b { color: var(--wait); } .kpi.ask b { color: var(--ask); } .kpi.test b { color: var(--test); }
section { margin-bottom: 40px; }
h2 { display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 600; text-transform: uppercase;
  letter-spacing: .06em; color: var(--muted); margin: 0 0 14px; }
h2 .count { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 0 8px;
  font-size: 12px; letter-spacing: 0; color: var(--text); font-variant-numeric: tabular-nums; }
.grid { display: grid; gap: 16px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 420px), 1fr)); align-items: start; }
.card { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px 20px 16px;
  box-shadow: var(--shadow); cursor: pointer; transition: border-color .15s, transform .15s; min-width: 0; overflow: hidden; }
.card::before { content: ""; position: absolute; inset: 0 auto 0 0; width: 3px; background: var(--accent, transparent); }
.card:hover { border-color: var(--line-strong); transform: translateY(-1px); }
.card:focus-visible, .row:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.card.nofocus { cursor: default; }
.head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.pill { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; padding: 2px 9px 2px 8px; border-radius: 999px; }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.run { color: var(--run); background: var(--run-soft); }
.pill.run i { animation: pulse 1.6s ease-in-out infinite; }
.pill.wait { color: var(--wait); background: var(--wait-soft); }
.pill.idle { color: var(--idle); background: var(--idle-soft); }
.pill.ask { color: var(--ask); background: var(--ask-soft); }
.pill.test { color: var(--test); background: var(--test-soft); }
.pill.frozen { color: var(--idle); background: var(--idle-soft); }
.pill.frozen i { background: none; border: 1.5px solid currentColor; width: 6px; height: 6px; }
.when.late { color: var(--wait); font-weight: 600; }
.unread { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--new); margin-right: 8px; vertical-align: middle; }
.card.is-unread { border-color: color-mix(in srgb, var(--new) 45%, var(--line)); }
.summary { margin-top: 10px; font-size: 13.5px; line-height: 1.45; display: flex; gap: 8px; }
.summary::before { content: "✦"; color: var(--faint); flex: none; }
.gitt { font: 11.5px ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); margin-left: 8px; white-space: nowrap; }
.gitt.up { color: var(--wait); }
.peer { margin-top: 10px; font-size: 12.5px; color: var(--muted); display: flex; gap: 6px; align-items: baseline; min-width: 0; }
.peer .who { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link { background: none; border: 0; padding: 0; font: inherit; color: var(--text); text-decoration: underline; text-decoration-color: var(--line-strong);
  text-underline-offset: 2px; cursor: pointer; }
.link:hover { text-decoration-color: currentColor; }
.h2-act { margin-left: 4px; text-transform: none; letter-spacing: 0; padding: 1px 8px; font-size: 12px; }
.msg.peer { align-self: stretch; border: 1px solid color-mix(in srgb, var(--ask) 35%, var(--line)); border-radius: 12px; padding: 10px 14px;
  background: color-mix(in srgb, var(--ask-soft) 45%, transparent); }
.msg.peer .psum { font-weight: 600; font-size: 13.5px; margin-bottom: 4px; }
.msg.peer details summary { cursor: pointer; color: var(--muted); font-size: 12.5px; }
.msg.peer .md { font-size: 13px; margin-top: 6px; }
@keyframes pulse { 50% { opacity: .35; } }
@media (prefers-reduced-motion: reduce) { .pill.run i, .activity i { animation: none; } .card { transition: none; } }
.tag { font-size: 11.5px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 6px; }
.when { margin-left: auto; color: var(--faint); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.name { font-size: 17px; font-weight: 620; letter-spacing: -.01em; margin: 10px 0 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.where { font: 12px/1.5 ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.where .branch { color: var(--text); }
.activity { margin-top: 12px; display: flex; align-items: center; gap: 8px; font-size: 13px; padding: 7px 10px; border-radius: 9px;
  background: var(--run-soft); min-width: 0; }
.activity i { flex: none; width: 7px; height: 7px; border-radius: 50%; background: var(--run); animation: pulse 1.6s ease-in-out infinite; }
.activity .tool { font-weight: 600; flex: none; }
.activity .det { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--muted); }
.activity .since { flex: none; color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.prompt { margin-top: 14px; display: flex; gap: 10px; font-size: 13px; }
.prompt .who { flex: none; font-weight: 600; color: var(--faint); font-size: 12px; padding-top: 1px; }
.prompt .txt { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--muted); }
.out { margin-top: 10px; background: var(--surface-2); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; font-size: 13.5px; }
.out.ask { border-color: color-mix(in srgb, var(--ask) 45%, var(--line)); }
.out .md { max-height: 9.6em; overflow: hidden; position: relative; overflow-wrap: anywhere; }
.out .md::after { content: ""; position: absolute; inset: auto 0 0 0; height: 2.4em; background: linear-gradient(transparent, var(--surface-2)); }
.out.open .md { max-height: none; } .out.open .md::after { display: none; }
.md p, .md ul, .md ol, .md pre { margin: 0 0 .6em; } .md > :last-child { margin-bottom: 0; }
.md ul, .md ol { padding-left: 1.3em; }
.md h4 { font-size: 13.5px; margin: .8em 0 .3em; } .md > h4:first-child { margin-top: 0; }
.md code { font: 12px ui-monospace, "SF Mono", Menlo, monospace; background: var(--code); padding: 1px 5px; border-radius: 5px; }
.md pre { background: var(--code); padding: 8px 10px; border-radius: 8px; overflow-x: auto; }
.md pre code { background: none; padding: 0; }
/* a wide table scrolls inside its own box instead of breaking words or pushing the page wider */
.md .tbl { overflow-x: auto; margin: 0 0 .6em; }
.md table { border-collapse: collapse; font-size: 12.5px; width: 100%; }
.md th, .md td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: normal; }
.md th { color: var(--muted); font-weight: 600; }
.more { margin-top: 6px; background: none; border: 0; padding: 0; color: var(--muted); font: inherit; font-size: 12.5px; cursor: pointer; }
.more:hover { color: var(--text); }
.empty-out { color: var(--faint); font-style: italic; }
.agents { margin-top: 12px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 2px; }
.agent { display: flex; align-items: center; gap: 10px; padding: 6px 8px; border-radius: 8px; font-size: 13px; color: var(--muted);
  background: none; border: 0; font: inherit; font-size: 13px; text-align: left; cursor: pointer; width: 100%; }
.agent:hover { background: var(--surface-2); }
.agent.on { background: var(--run-soft); color: var(--text); }
.agent .ic { flex: none; width: 14px; text-align: center; font-size: 11px; }
.agent.on .ic { color: var(--run); }
.agent .d { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.agent .t { font-weight: 600; }
.agent.fold { position: sticky; top: 0; background: var(--surface); color: var(--text); }
.agent.fold:hover { background: var(--surface-2); }
.agent .a { flex: none; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.agent-out { margin: 2px 0 6px 32px; font-size: 12.5px; padding: 8px 10px; border-left: 2px solid var(--line-strong); color: var(--muted); overflow-wrap: anywhere; }
.agent-out .md { max-height: 14em; overflow: auto; }
.ctx { margin-top: 12px; display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--faint); font-variant-numeric: tabular-nums; }
.ctx .meter { flex: 0 0 72px; height: 4px; border-radius: 2px; background: var(--bar); overflow: hidden; }
.ctx .meter span { display: block; height: 100%; background: var(--muted); border-radius: 2px; }
.ctx.hot .meter span { background: var(--wait); } .ctx.hot { color: var(--wait); }
.gh { flex: none; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; border: 1px solid transparent;
  background: none; color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; opacity: 0; transition: opacity .15s; }
.card:hover .gh, .card:focus-within .gh, .gh:focus-visible { opacity: 1; }
.gh:hover { border-color: var(--line-strong); color: var(--text); background: var(--surface-2); }
.scrim { position: fixed; inset: 0; background: rgba(10,10,9,.45); z-index: 10; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(780px, 100vw); z-index: 11; display: flex; flex-direction: column;
  background: var(--bg); border-left: 1px solid var(--line-strong); box-shadow: -12px 0 40px rgba(0,0,0,.25); animation: slide .18s ease-out; }
@keyframes slide { from { transform: translateX(24px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) { .drawer { animation: none; } }
.dhead { padding: 20px 24px 16px; border-bottom: 1px solid var(--line); background: var(--surface); }
.dhead .bar1 { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
.dhead .bar1 > * { white-space: nowrap; }
.dhead .bar1 .sp { flex: 1; }
.dhead .name { font-size: 20px; margin-top: 10px; white-space: normal; }
.dhead .agents { max-height: 30vh; overflow: auto; }
.dbody { flex: 1; overflow: auto; padding: 20px 24px 28px; display: flex; flex-direction: column; gap: 14px; }
.dfoot { padding: 14px 24px 18px; border-top: 1px solid var(--line); background: var(--surface); }
.dfoot .reply { margin-top: 0; }
.dfoot .note { color: var(--faint); font-size: 13px; }
.msg { max-width: 100%; min-width: 0; }
.msg .meta { font-size: 11.5px; color: var(--faint); margin-bottom: 4px; font-variant-numeric: tabular-nums; }
.msg.user { align-self: flex-end; max-width: 85%; }
.msg.user .meta { text-align: right; }
.msg.user .bubble { background: var(--wait-soft); color: var(--text); border-radius: 14px 14px 4px 14px; padding: 10px 14px;
  white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13.5px; }
.msg.assistant .md { font-size: 14px; overflow-wrap: anywhere; }
.msg.tools details { font: 12px/1.6 ui-monospace, "SF Mono", Menlo, monospace; color: var(--muted); }
.msg.tools summary { cursor: pointer; list-style: none; padding: 4px 10px; border: 1px dashed var(--line-strong); border-radius: 8px;
  display: inline-block; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.msg.tools summary::-webkit-details-marker { display: none; }
.msg.tools ul { margin: 6px 0 0; padding-left: 1.2em; }
.msg.tools li { overflow-wrap: anywhere; }
.loading { color: var(--faint); }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden; box-shadow: var(--shadow); }
.row { display: grid; grid-template-columns: 14px minmax(0, 2fr) minmax(0, 2fr) minmax(0, 3fr) 80px; gap: 14px; align-items: center;
  padding: 11px 18px; border-top: 1px solid var(--line); cursor: pointer; font-size: 13.5px; }
.row:first-child { border-top: 0; } .row:hover { background: var(--surface-2); }
.row .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent, var(--idle)); }
.row .n { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .p, .row .o { color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .p { font: 12px ui-monospace, "SF Mono", Menlo, monospace; }
.row .w { color: var(--faint); font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; }
.reply { margin-top: 12px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.reply textarea { flex: 1 1 200px; min-width: 0; font: inherit; font-size: 13.5px; color: var(--text); background: var(--surface-2);
  border: 1px solid var(--line-strong); border-radius: 9px; padding: 7px 10px; outline: none;
  resize: none; field-sizing: content; max-height: 40vh; }
.reply textarea:focus { border-color: var(--focus); }
.dialogbox { margin-top: 10px; padding: 8px 10px; border-left: 3px solid var(--wait); background: var(--wait-soft); border-radius: 6px; font-size: 13.5px; line-height: 1.45; overflow-wrap: anywhere; }
.dialogbox .dt { color: var(--wait); font-weight: 600; font-size: 12px; }
.dialogbox .dq + .dq { margin-top: 6px; }
.dialogbox .dq > :first-child, .dialogbox .dcmd { white-space: pre-line; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 6; overflow: hidden; }
.card .dialogbox .plan { max-height: 12em; overflow: hidden; }
.dopts { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 4px; }
.dopt { padding: 2px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--bar); font: inherit; font-size: 12.5px; color: var(--text); cursor: pointer; }
.dialogbox .dact { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.dialogbox .dnote { align-self: center; font-size: 12px; }
.btn:disabled, .dopt:disabled { opacity: .6; cursor: default; }
.dopt:hover { border-color: var(--wait); }
.dopt.on { background: var(--wait); border-color: var(--wait); color: var(--surface); }
.reply .dialog { flex: 1 1 100%; color: var(--muted); font-size: 13px; }
.btn { font: inherit; font-size: 12.5px; font-weight: 600; padding: 6px 12px; border-radius: 9px; cursor: pointer;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--text); }
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--wait); border-color: var(--wait); color: #fff; }
.btn.ghost { border-color: transparent; background: none; color: var(--muted); }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-top: 12px; padding: 10px 12px; border-radius: 10px;
  background: var(--wait-soft); font-size: 13px; }
.confirm span { flex: 1 1 260px; }
.confirm code { white-space: nowrap; }
select.chip { color: var(--text); }
.toast { position: fixed; left: 50%; bottom: 28px; transform: translate(-50%, 20px); opacity: 0; background: var(--text); color: var(--bg);
  padding: 10px 16px; border-radius: 10px; font-size: 13.5px; transition: opacity .2s, transform .2s; pointer-events: none; z-index: 20; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }
.toast .link { color: inherit; font-weight: 600; margin-left: 12px; }
.toast.show .link { pointer-events: auto; }
.offline { color: var(--wait); }
.none { color: var(--faint); padding: 8px 0; }
@media (max-width: 760px) {
  .wrap { padding: 20px 16px 48px; }
  /* the counters shrink to a row of chips, so the first cards show on the first screen */
  .kpis { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 24px; }
  .kpi { display: flex; align-items: baseline; gap: 6px; padding: 5px 11px; border-radius: 999px; box-shadow: none; }
  .kpi b { display: inline; font-size: 16px; } .kpi span { font-size: 12.5px; }
  .row { grid-template-columns: 14px minmax(0, 1fr) 70px; } .row .p, .row .o { display: none; }
  .sub .keys { display: none; }
  .dhead { position: relative; padding: 16px 16px 12px; }
  .dhead .bar1 { flex-wrap: wrap; padding-right: 40px; }
  .dhead .bar1 .sp { flex-basis: 100%; height: 0; }
  .dhead .close { position: absolute; top: 10px; right: 10px; }
  .dbody { padding: 16px; } .dfoot { padding: 12px 16px 16px; }
  .msg.user { max-width: 92%; }
}
/* iOS zooms into any text field under 16px when it gets focus; last, so it wins over the sizes above */
@media (pointer: coarse) { .search, .reply textarea, select.chip { font-size: 16px; } }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div>
      <h1 data-i18n="title">Claude Dashboard</h1>
      <div class="sub"><span id="sub" data-i18n="loading"></span><span class="keys" id="keys"></span></div>
    </div>
    <div class="lang" id="lang" role="group" aria-label="Language / Langue"><button data-lang="en">EN</button><button data-lang="fr">FR</button></div>
  </div>
  <div class="bar">
    <input class="search" id="search" type="search" autocomplete="off">
    <label class="chip"><input type="checkbox" id="byProject"> <span data-i18n="byProject"></span></label>
    <label class="chip"><input type="checkbox" id="showIdle"> <span data-i18n="showIdle"></span></label>
    <select class="chip" id="newIn"><option value=""></option></select>
    <button class="chip" id="alerts" data-i18n="alerts" hidden></button>
  </div>
  <div class="kpis" id="kpis"></div>
  <div id="sections"></div>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" role="dialog" aria-modal="true" hidden></aside>
<div class="toast" id="toast" role="status"></div>
<script>
const COLORS = { red: '#e5484d', orange: '#f76b15', yellow: '#e2a336', green: '#30a46c', cyan: '#00a2c7', blue: '#3e63dd',
  purple: '#8e4ec6', pink: '#d6409f' }

  const all = data.sessions, shown = all.filter(s => matches(s, q))
  const groups = { run: [], wait: [], stale: [] }
  for (const s of shown) groups[group(s)].push(s)
  for (const list of Object.values(groups)) list.sort(byRecent)  // the latest answer first; a long wait shows in red
  const waiting = all.filter(s => group(s) === 'wait')
  const tests = waiting.filter(isTest).length, questions = waiting.filter(s => !isTest(s) && isQuestion(s)).length
  const unreadCount = waiting.filter(isUnread).length
  const activeAgents = all.reduce((n, s) => n + s.agents.filter(a => a.isActive).length, 0)
  $('kpis').replaceChildren(...[
    ['run', all.filter(s => bucket(s) === 'run').length, t('kRun')],
    ['wait', waiting.length, t('kWait')],
    ['ask', questions, t('kAsk', questions)],
    ['test', tests, t('kTest')],
    ['', activeAgents, t('kAgents', activeAgents)],
  ].map(([cls, n, label]) => h('div', { class: 'kpi ' + cls }, h('b', {}, n), h('span', {}, label))))
  badge(waiting.length)

  let sections
  if ($('byProject').checked) {
    const projects = new Map()
    for (const s of shown) (projects.get(project(s)) || projects.set(project(s), []).get(project(s))).push(s)
    sections = [...projects.entries()]
      .map(([name, list]) => [name, list.sort(byRecent)])
      .sort((a, b) => seen(b[1][0]) - seen(a[1][0]))
      .filter(([, list]) => $('showIdle').checked || list.some(s => group(s) !== 'stale'))
      .map(([name, list]) => sec(name, list.length, cardsAndRows(list),
        h('button', { class: 'btn ghost h2-act', title: t('newInTitle', list[0].cwd), onclick: () => newSession(list[0].cwd) }, t('plusSession'))))
  } else {
    sections = [
      sec(t('secRun'), groups.run.length, groups.run.length ? h('div', { class: 'grid' }, groups.run.map(card)) : h('div', { class: 'none' }, t('nothing'))),
      sec(t('secWait'), groups.wait.length + (unreadCount ? t('fresh', unreadCount) : ''), groups.wait.length ? h('div', { class: 'grid' }, groups.wait.map(card)) : h('div', { class: 'none' }, t('nothing'))),
      sec(t('secStale'), groups.stale.length, $('showIdle').checked && groups.stale.length > 0 && h('div', { class: 'list' }, groups.stale.map(row))),
    ]
  }
  if (q && !shown.length) sections = [h('div', { class: 'none' }, t('noMatch', q))]
  $('sections').replaceChildren(...sections)
  if (detailPid != null) renderDrawer()
  if (focusedPid && detailPid == null) document.querySelector(`[data-pid="${focusedPid}"]`)?.focus({ preventScroll: true })
  if (replyPid) focusReply(+replyPid)
  tick()
}

function tick() {
  for (const n of document.querySelectorAll('[data-ago]')) n.textContent = ago(+n.dataset.ago)
  for (const n of document.querySelectorAll('[data-short]')) n.textContent = short(+n.dataset.short)
  for (const n of document.querySelectorAll('[data-since]')) n.textContent = since(+n.dataset.since)
  for (const n of document.querySelectorAll('[data-wait]')) {
    n.textContent = t('waitingFor', duration(+n.dataset.wait))
    n.classList.toggle('late', Date.now() - n.dataset.wait > 3600 * 1000)
  }
  if (data) $('sub').textContent = t('updated', new Date().toLocaleTimeString(locale(), { hour: '2-digit', minute: '2-digit' }))
}

// ---------- keyboard ----------
document.addEventListener('keydown', e => {
  const typing = e.target.matches?.('input, textarea')
  if (e.key === 'Escape' && typing) { e.target.value = ''; e.target.blur(); draw(); return }
  if (typing || e.metaKey || e.ctrlKey || e.altKey) return
  if (detailPid != null) {
    const s = data?.sessions.find(x => x.pid === detailPid)
    if (e.key === 'Escape') { e.preventDefault(); closeDetail() }
    else if (e.key === 'o' && s) { e.preventDefault(); focusSession(s) }
    else if (e.key === 'r' && s && canReply(s)) { e.preventDefault(); focusReply(s.pid) }
    return
  }
  if (e.key === 'o') {
    const s = data?.sessions.find(x => x.pid === +document.activeElement?.dataset?.pid)
    if (s) { e.preventDefault(); focusSession(s) }
    return
  }
  if (e.key === '/') { e.preventDefault(); $('search').focus(); return }
  if (e.key === 'r') {
    const pid = +document.activeElement?.dataset?.pid, s = data?.sessions.find(x => x.pid === pid)
    if (s && canReply(s)) { e.preventDefault(); openReply(s) }
    return
  }
  const step = e.key === 'j' || e.key === 'ArrowDown' ? 1 : e.key === 'k' || e.key === 'ArrowUp' ? -1 : 0
  if (!step) return
  e.preventDefault()
  const navs = [...document.querySelectorAll('[data-nav]')]
  const next = navs[Math.max(0, Math.min(navs.length - 1, navs.indexOf(document.activeElement) + step))]
  next?.focus(); next?.scrollIntoView({ block: 'nearest', behavior: 'smooth' })
})

// ---------- polling ----------
async function poll() {
  try {
    const json = await (await fetch('/api/sessions', { cache: 'no-store' })).json()
    data = json
    drawFolders(json.folders)
    primeSeen(json.sessions)
    notifyTransitions(json.sessions)
    const key = JSON.stringify(json)
    // ponytail: "typing" = window focused and a key in the reply field within 15 s; a pause longer than that gets a redraw
    const typingReply = document.hasFocus() && document.activeElement?.closest?.('.reply') && Date.now() - lastReplyKey < 15000
    // page.html changed on the server: reload, unless a reply is being written or sent (it would be lost)
    if (json.page !== PAGE && !sending.size && ![...replies.values()].some(r => r.text.trim())) return location.reload()
    if (key !== lastJson && !typingReply) { lastJson = key; draw() } else tick()
    if (detailPid != null) loadHistory()
  } catch {
    $('sub').replaceChildren(h('span', { class: 'offline' }, t('offline')))
  }
}
poll()
setInterval(poll, 3000)
</script>
